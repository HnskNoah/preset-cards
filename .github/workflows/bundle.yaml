name: bundle

on:
  push:
    branches:
      - dev-ts
      - ts
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      # checkout
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # release tag 仅 ts 分支发；dev-ts 发 debug 版
      - id: autotag_check
        shell: bash
        run: |-
          message=$(git log -n 1 --pretty=format:"%s")
          if [[ "${{ github.ref_name }}" == "ts" && ( $message == *"[release]"* || $message == *"[release patch]"* ) ]]; then
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "ts" && $message == *"[release minor]"* ]]; then
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "ts" && $message == *"[release major]"* ]]; then
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
            echo "bump=major" >> "$GITHUB_OUTPUT"
          else
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ github.ref_type != 'tag' && steps.autotag_check.outputs.should_tag == 'true' }}
        id: autotag
        uses: phish108/autotag-action@v1.1.64
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-branch: ''
          bump: ${{ steps.autotag_check.outputs.bump }}
          dry-run: true
          with-v: true
      - if: ${{ github.ref_type == 'tag' }}
        id: manual_tag
        env:
          VALUE: ${{ github.ref }}
        run: |-
          export TAG=${VALUE##refs/tags/}
          echo result=$TAG >> "$GITHUB_OUTPUT"
      - if: ${{ github.ref_type == 'tag' || steps.autotag_check.outputs.should_tag == 'true' }}
        id: package_version
        run: |-
          RAW="${{ github.ref_type == 'tag' && steps.manual_tag.outputs.result || steps.autotag.outputs.new-tag }}"
          CLEAN="${RAW#v}"
          echo "result=\"version\": \"$CLEAN\"" >> "$GITHUB_OUTPUT"
      - if: ${{ github.ref_type == 'tag' || steps.autotag_check.outputs.should_tag == 'true' }}
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          include: manifest.json
          find: '"version": "\d+\.\d+\.\d+"'
          replace: ${{ steps.package_version.outputs.result }}
          regex: true
      - if: ${{ github.ref_type == 'tag' || steps.autotag_check.outputs.should_tag == 'true' }}
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          include: package.json
          find: '"version": "\d+\.\d+\.\d+"'
          replace: ${{ steps.package_version.outputs.result }}
          regex: true

      # build: dev-ts / ts 均构建压缩版
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # commit dist changes (no-op if unchanged)
      - uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] Bundle'
      - if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |-
          git tag -d ${{ steps.manual_tag.outputs.result }}
          git push --delete origin ${{ steps.manual_tag.outputs.result }}
      - if: ${{ github.ref_type == 'tag' || steps.autotag_check.outputs.should_tag == 'true' }}
        shell: bash
        run: |-
          git tag ${{ github.ref_type == 'tag' && steps.manual_tag.outputs.result || steps.autotag.outputs.new-tag }}
          git push --tags

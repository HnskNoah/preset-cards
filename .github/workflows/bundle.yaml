name: bundle

on:
  push:
    branches:
      - dev-ts
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      # checkout dev-ts (source)
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # release tag 检测：dev-ts 提交含 [release] 时发版
      - id: autotag_check
        shell: bash
        run: |-
          message=$(git log -n 1 --pretty=format:"%s")
          if [[ $message == *"[release]"* || $message == *"[release patch]"* ]]; then
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          elif [[ $message == *"[release minor]"* ]]; then
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif [[ $message == *"[release major]"* ]]; then
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
            echo "bump=major" >> "$GITHUB_OUTPUT"
          else
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
            echo "bump=" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ github.ref_type != 'tag' && steps.autotag_check.outputs.should_tag == 'true' }}
        id: autotag
        uses: phish108/autotag-action@v1.1.64
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-branch: ''
          bump: ${{ steps.autotag_check.outputs.bump }}
          dry-run: true
          with-v: true
      - if: ${{ github.ref_type == 'tag' }}
        id: manual_tag
        env:
          VALUE: ${{ github.ref }}
        run: |-
          export TAG=${VALUE##refs/tags/}
          echo result=$TAG >> "$GITHUB_OUTPUT"
      - if: ${{ github.ref_type == 'tag' || steps.autotag_check.outputs.should_tag == 'true' }}
        id: package_version
        run: |-
          RAW="${{ github.ref_type == 'tag' && steps.manual_tag.outputs.result || steps.autotag.outputs.new-tag }}"
          CLEAN="${RAW#v}"
          echo "result=\"version\": \"$CLEAN\"" >> "$GITHUB_OUTPUT"
      - if: ${{ github.ref_type == 'tag' || steps.autotag_check.outputs.should_tag == 'true' }}
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          include: manifest.json
          find: '"version": "\d+\.\d+\.\d+"'
          replace: ${{ steps.package_version.outputs.result }}
          regex: true

      # build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # commit dist to dev-ts (no-op if unchanged)
      - uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] Bundle'
      - if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |-
          git tag -d ${{ steps.manual_tag.outputs.result }}
          git push --delete origin ${{ steps.manual_tag.outputs.result }}
      - if: ${{ github.ref_type == 'tag' || steps.autotag_check.outputs.should_tag == 'true' }}
        shell: bash
        run: |-
          git tag ${{ github.ref_type == 'tag' && steps.manual_tag.outputs.result || steps.autotag.outputs.new-tag }}
          git push --tags

      # 同步产物到 ts（纯产物镜像分支）：保存产物 → 检出 ts → 覆盖运行文件 → 提交推送
      - name: Sync artifacts to ts
        shell: bash
        run: |-
          set -e
          ROOT="$GITHUB_WORKSPACE"
          TMP="$(mktemp -d)"
          cp -f "$ROOT/manifest.json" "$TMP/manifest.json"
          cp -rf "$ROOT/dist" "$TMP/dist"
          cp -f "$ROOT/style.css" "$TMP/style.css"
          cp -f "$ROOT/cards.html" "$TMP/cards.html"
          cp -f "$ROOT/edit.html" "$TMP/edit.html"
          cp -f "$ROOT/profile-editor.html" "$TMP/profile-editor.html"
          cp -rf "$ROOT/llm-logos" "$TMP/llm-logos"

          git fetch origin ts
          git checkout -B ts-sync origin/ts

          rm -rf dist llm-logos
          rm -f manifest.json style.css cards.html edit.html profile-editor.html
          cp -f "$TMP/manifest.json" manifest.json
          cp -rf "$TMP/dist" dist
          cp -f "$TMP/style.css" style.css
          cp -f "$TMP/cards.html" cards.html
          cp -f "$TMP/edit.html" edit.html
          cp -f "$TMP/profile-editor.html" profile-editor.html
          cp -rf "$TMP/llm-logos" llm-logos
          rm -rf "$TMP"

          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "[bot] Sync artifacts"
            git push origin HEAD:ts
          else
            echo "no artifact changes"
          fi

      # 同步产物到 preset-cards-release 的 TS 分支（纯产物发布仓库）
      - name: Sync artifacts to preset-cards-release
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: bash
        run: |-
          set -e
          if [ -z "$RELEASE_REPO_TOKEN" ]; then
            echo "RELEASE_REPO_TOKEN 未配置，跳过"
            exit 0
          fi
          ROOT="$GITHUB_WORKSPACE"
          TMP="$(mktemp -d)"
          cp -f "$ROOT/manifest.json" "$TMP/manifest.json"
          cp -rf "$ROOT/dist" "$TMP/dist"
          cp -f "$ROOT/style.css" "$TMP/style.css"
          cp -f "$ROOT/cards.html" "$TMP/cards.html"
          cp -f "$ROOT/edit.html" "$TMP/edit.html"
          cp -f "$ROOT/profile-editor.html" "$TMP/profile-editor.html"
          cp -rf "$ROOT/llm-logos" "$TMP/llm-logos"

          git clone --no-checkout "https://x-access-token:${RELEASE_REPO_TOKEN}@github.com/HnskNoah/preset-cards-release.git" "$TMP/repo"
          REL="$TMP/repo"
          git -C "$REL" checkout -B TS-sync origin/TS
          rm -rf "$REL/dist" "$REL/llm-logos"
          rm -f "$REL/manifest.json" "$REL/style.css" "$REL/cards.html" "$REL/edit.html" "$REL/profile-editor.html"
          cp -f "$TMP/manifest.json" "$REL/manifest.json"
          cp -rf "$TMP/dist" "$REL/dist"
          cp -f "$TMP/style.css" "$REL/style.css"
          cp -f "$TMP/cards.html" "$REL/cards.html"
          cp -f "$TMP/edit.html" "$REL/edit.html"
          cp -f "$TMP/profile-editor.html" "$REL/profile-editor.html"
          cp -rf "$TMP/llm-logos" "$REL/llm-logos"
          cp -f "$ROOT/README.md" "$REL/README.md"
          cp -f "$ROOT/LICENSE" "$REL/LICENSE"
          cp -f "$ROOT/Preset-cards.md" "$REL/Preset-cards.md"
          cp -f "$ROOT/.gitignore" "$REL/.gitignore"
          cp -f "$ROOT/.gitattributes" "$REL/.gitattributes"

          git -C "$REL" add -A
          if ! git -C "$REL" diff --cached --quiet; then
            git -C "$REL" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "[bot] Sync artifacts"
            git -C "$REL" push origin HEAD:TS
          else
            echo "no artifact changes for release repo"
          fi
          rm -rf "$TMP"
